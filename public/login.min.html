<!DOCTYPE html><html lang="en" data-theme="dark" class="dark"><head><script src="/js/vt-guard.min.js" integrity="sha384-dmOYSbgdlzV+rjjfkSxx4qSuOe2g6isBKijHW2HuuISYl+j7AgDGTp9hOuLdlw3F" crossorigin="anonymous"></script><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="color-scheme" content="dark only"/><meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)"/><meta name="theme-color" content="#121212"/><title>Sign in · Sendit!</title><link rel="icon" href="/favicon.ico"/><link rel="stylesheet" href="/css/style.min.css" integrity="sha384-T7RnBoP6Gw9pkGhwItD8j+unqCe05nH2hn5N5zRZUoo8XgNPDkG4e+QZx4bRq4eI" crossorigin="anonymous"/><link rel="stylesheet" href="/api/v1/branding/theme.css"/></head><body data-page="login" class="auth-page"><div class="auth-layout"><main class="auth-panel"><div class="auth-card"><div class="auth-brand-center"><img class="brand-logo brand-logo-auth" src="/api/v1/branding/logo.svg" alt="Sendit!"/></div><div id="alert" class="alert hidden"></div><div id="password-step"><form id="login-form" method="post" action="/login" autocomplete="on"><label for="email">Email</label><input id="email" name="username" type="email" required autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="email"/><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8" maxlength="256" autocomplete="current-password"/><button type="submit" class="btn-block">Sign in</button></form><p class="auth-footer-link"><a href="/forgot-password">Forgot password?</a></p></div><div class="hidden" id="email-otp-step"><form id="email-otp-form" method="post" action="/login" autocomplete="on"><input type="email" id="email-otp-username" name="username" autocomplete="username" class="pm-assist-field" tabindex="-1" aria-hidden="true"/><label for="email-otp-code">Email verification code</label><input id="email-otp-code" name="
