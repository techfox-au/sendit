<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark only" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#121212" />
    <meta name="referrer" content="no-referrer" />
    <title>Reset password · Sendit!</title>
        <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/api/v1/branding/theme.css" />
  </head>
  <body data-page="reset" class="auth-page">
    <div class="auth-layout">
      <main class="auth-panel">
        <div class="auth-card">
          <div class="auth-brand-center"><img class="brand-logo brand-logo-auth" src="/api/v1/branding/logo.svg" alt="Sendit!" /></div>
          <div id="alert" class="alert hidden"></div>
          <div id="reset-panel">
            <div class="alert warn">
              Resetting your password creates a new encryption key and
              <strong>permanently deletes</strong> all sends and collects for this account.
              If two-factor authentication is enabled, your authenticator code is required.
            </div>
            <form id="reset-form" method="post" action="/reset-password" autocomplete="on">
              <label for="password">New password (min 8 characters) <span class="req" aria-hidden="true">*</span></label>
              <input
                id="password"
                name="new-password"
                type="password"
                required
                minlength="8"
                maxlength="256"
                autocomplete="new-password"
              />
              <div id="totp-wrap" class="hidden">
                <label for="totp-code">Authenticator code <span class="req" aria-hidden="true">*</span></label>
                <input
                  id="totp-code"
                  name="totp"
                  type="text"
                  class="otp-code-input"
                  inputmode="numeric"
                  pattern="[0-9]{8}"
                  minlength="8"
                  maxlength="8"
                  autocomplete="one-time-code"
                  autocapitalize="off"
                  autocorrect="off"
                  spellcheck="false"
                />
              </div>
              <button type="submit" class="btn-block danger">Reset password (deletes my data)</button>
            </form>
          </div>
          <p class="auth-footer-link"><a href="/login">Back to sign in</a></p>
        </div>
      </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/user-data-key.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/auth-pages.js"></script>
  </body>
</html>
