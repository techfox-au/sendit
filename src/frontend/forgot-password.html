<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark only" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#121212" />
    <title>Forgot password? · Sendit!</title>
        <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/api/v1/branding/theme.css" />
  </head>
  <body data-page="forgot" class="auth-page">
    <div class="auth-layout">
      <main class="auth-panel">
        <div class="auth-card">
          <div class="auth-brand-center"><img class="brand-logo brand-logo-auth" src="/api/v1/branding/logo.svg" alt="Sendit!" /></div>
          <h2 class="auth-card-title">Forgot password?</h2>
          <p class="auth-card-lead">
            We will email a one-time link if an account exists for that address.
          </p>
          <div id="alert" class="alert hidden"></div>
          <form id="forgot-form" method="post" action="/forgot-password" autocomplete="on">
            <label for="email">Email</label>
            <input
              id="email"
              name="username"
              type="email"
              required
              autocomplete="username"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              inputmode="email"
            />
            <button type="submit" class="btn-block">Send reset link</button>
          </form>
          <p class="auth-footer-link"><a href="/login">Back to sign in</a></p>
        </div>
      </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/pow.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/auth-pages.js"></script>
  </body>
</html>
