<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark only" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#121212" />
    <title>Sign in · Sendit!</title>
        <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/api/v1/branding/theme.css" />
  </head>
  <body data-page="login" class="auth-page">
    <div class="auth-layout">
      <main class="auth-panel">
        <div class="auth-card">
          <div class="auth-brand-center"><img class="brand-logo brand-logo-auth" src="/api/v1/branding/logo.svg" alt="Sendit!" /></div>
          <div id="alert" class="alert hidden"></div>
          <div id="password-step">
            <!--
              name + autocomplete: Bitwarden / browser password managers.
              username + current-password is the standard login pair.
            -->
            <form id="login-form" method="post" action="/login" autocomplete="on">
              <label for="email">Email</label>
              <input
                id="email"
                name="username"
                type="email"
                required
                autocomplete="username"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                inputmode="email"
              />
              <label for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                required
                minlength="8"
                maxlength="256"
                autocomplete="current-password"
              />
              <button type="submit" class="btn-block">Sign in</button>
            </form>
            <p class="auth-footer-link"><a href="/forgot-password">Forgot password?</a></p>
          </div>
          <div class="hidden" id="email-otp-step">
            <form id="email-otp-form" method="post" action="/login" autocomplete="on">
              <!-- Hidden username keeps the vault entry associated across steps. -->
              <input
                type="email"
                id="email-otp-username"
                name="username"
                autocomplete="username"
                class="pm-assist-field"
                tabindex="-1"
                aria-hidden="true"
              />
              <label for="email-otp-code">Email verification code</label>
              <input
                id="email-otp-code"
                name="code"
                type="text"
                class="otp-code-input"
                inputmode="numeric"
                pattern="[0-9]{6}"
                minlength="6"
                maxlength="6"
                autocomplete="one-time-code"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                required
              />
              <label for="password-confirm">Confirm password</label>
              <input
                id="password-confirm"
                name="password-confirm"
                type="password"
                required
                minlength="8"
                maxlength="256"
                autocomplete="new-password"
              />
              <p class="field-hint">Re-enter the password you just used so we know it was typed correctly.</p>
              <button type="submit" class="btn-block">Verify email</button>
            </form>
          </div>
          <div class="hidden" id="totp-step">
            <form id="totp-form" method="post" action="/login" autocomplete="on">
              <!-- Username context so Bitwarden can offer TOTP for this login. -->
              <input
                type="email"
                id="totp-username"
                name="username"
                autocomplete="username"
                class="pm-assist-field"
                tabindex="-1"
                aria-hidden="true"
              />
              <label for="totp-code">Authenticator code</label>
              <input
                id="totp-code"
                name="totp"
                type="text"
                class="otp-code-input"
                inputmode="numeric"
                pattern="[0-9]{8}"
                minlength="8"
                maxlength="8"
                autocomplete="one-time-code"
                required
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
              />
              <button type="submit" class="btn-block">Verify</button>
            </form>
          </div>
        </div>
      </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/pow.js"></script>
    <script src="/js/user-data-key.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/auth-pages.js"></script>
  </body>
</html>
