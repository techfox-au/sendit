<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark only" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#121212" />
    <title>Upload secret · Sendit!</title>
        <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/api/v1/branding/theme.css" />
</head>
  <body data-page="upload">
    <div class="wrap">
      <header class="app"><a class="brand" href="/dashboard"><img class="brand-logo" src="/api/v1/branding/logo.svg" alt="Sendit!" /></a></header>
      <h1 id="page-title">Upload secret</h1>
      <p class="lead" id="meta"></p>
      <div id="alert" class="alert hidden"></div>
      <div class="card hidden" id="upload-panel">
        <p id="collect-name" class="secret-label hidden"></p>
        <form id="upload-form">
          <fieldset class="content-type">
            <legend>Content type</legend>
            <label class="radio">
              <input type="radio" name="content-kind" value="text" checked />
              Text
            </label>
            <label class="radio">
              <input type="radio" name="content-kind" value="file" />
              File
            </label>
          </fieldset>

          <div id="panel-text">
            <label for="secret-text">Secret text <span class="req" aria-hidden="true">*</span></label>
            <textarea
              id="secret-text"
              name="secret-text"
              maxlength="90000000"
              placeholder="Paste token, note, or other secret…"
              autocomplete="off"
              data-1p-ignore
              data-lpignore="true"
              data-form-type="other"
              data-bwignore
            ></textarea>
          </div>
          <div id="panel-file" class="hidden">
            <span class="field-label">File (max 100 MB) <span class="req" aria-hidden="true">*</span></span>
            <div class="file-picker">
              <input id="secret-file" class="file-input-native" type="file" />
              <label for="secret-file" class="btn file-picker-btn">Choose file</label>
              <span id="secret-file-name" class="file-picker-name">No file chosen</span>
            </div>
          </div>

          <button type="submit">Encrypt &amp; upload</button>
        </form>
      </div>
    </div>
    <script src="/vendor/nacl-fast.js"></script>
    <script src="/js/crypto.js"></script>
    <script src="/js/pow.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/request.js"></script>
  </body>
</html>
