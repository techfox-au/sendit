# Sendit! — host nginx: TLS + static UI; API is Docker on 127.0.0.1:8080
#
# Frontend (host):
#   python3 scripts/build-frontend.py
#   rsync/copy public/ → root below
#
# API:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Adjust server_name and certificate paths. TLS is host-managed (certbot, etc.).

limit_req_zone $binary_remote_addr zone=sendit_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=sendit_auth:10m rate=10r/s;
# Health / SPA downtime probe — still limited, but much more tolerant than general /api/
# so a short burst of taps + Retry does not starve liveness checks.
limit_req_zone $binary_remote_addr zone=sendit_health:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=sendit_conn:10m;
# Rate limits must not look like "service down" (default nginx status is 503).
# The SPA treats 429 as a normal error and only shows the downtime modal after a failed health probe.
limit_req_status 429;

upstream sendit_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Redirect HTTP → HTTPS (ACME on host: use certbot webroot separately if needed)
server {
    listen 80;
    listen [::]:80;
    server_name sendit.example.com;

    # Let's Encrypt / certbot HTTP-01 (host-managed)
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/acme;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sendit.example.com;

    # ssl_certificate     /etc/letsencrypt/live/sendit.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sendit.example.com/privkey.pem;

    # --- TLS (Mozilla intermediate-style) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519:secp384r1:prime256v1;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/letsencrypt/live/sendit.example.com/chain.pem;

    root /var/www/sendit/public;
    # Default body cap (auth, meta, etc.). Large create/upload routes override below.
    client_max_body_size 256k;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;
    server_tokens off;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Only Chromium-recognized feature names (unknown tokens log console errors).
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    # Enable after HTTPS is verified:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    limit_conn sendit_conn 40;

    location /api/v1/auth/ {
        limit_req zone=sendit_auth burst=20 nodelay;
        proxy_pass http://sendit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        client_max_body_size 256k;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Large payload routes (must appear before the general /api/ block).
    # - create send/collect (auth enforced in API)
    # - public collect upload (unauthenticated large secret)
    location = /api/v1/send {
        limit_req zone=sendit_api burst=60 nodelay;
        proxy_pass http://sendit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/v1/collect {
        limit_req zone=sendit_api burst=60 nodelay;
        proxy_pass http://sendit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/api/v1/collect/[^/]+/upload$ {
        limit_req zone=sendit_api burst=60 nodelay;
        proxy_pass http://sendit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Liveness probe for the SPA downtime modal — own, more tolerant limit
    # (10 r/s + burst 100) so it is not starved by general /api/ bursts.
    location = /api/v1/health {
        limit_req zone=sendit_health burst=100 nodelay;
        proxy_pass http://sendit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        client_max_body_size 256k;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        limit_req zone=sendit_api burst=60 nodelay;
        proxy_pass http://sendit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        client_max_body_size 256k;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Rocket favicon is generated by the API (SENDIT_HIGHLIGHT). Do not try_files
    # to login.min.html — missing file would serve HTML as "favicon.ico".
    location = /favicon.ico {
        proxy_pass http://sendit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location = / {
        return 302 /login;
    }

    location / {
        # Built pages are *.min.html (e.g. /login → login.min.html)
        try_files $uri.min.html $uri $uri/ /login.min.html;
    }

    # No directory listings; deny dotfiles except ACME (handled on :80)
    location ~ /\. {
        deny all;
    }
}
