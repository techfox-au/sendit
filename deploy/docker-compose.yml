# Sendit!: API-only container; host nginx serves public/ + TLS
#
# Builds for the architecture of the machine you run this on (no multi-arch push).
#
#   python3 scripts/build-frontend.py
#   rsync -a --delete public/ user@host:/var/www/sendit/public/
#   # install deploy/nginx/sendit.conf on the host
#   docker compose -f deploy/docker-compose.yml up -d --build
#
services:
  sendit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sendit:local
    container_name: sendit-api
    restart: unless-stopped
    environment:
      SENDIT_DB_PATH: /data/sendit.db
      SENDIT_PUBLIC_BASE_URL: https://sendit.example.com
      # Host nginx owns browser security headers (avoid duplicates from Kestrel).
      SENDIT_EDGE_SECURITY_HEADERS: "1"
      # Quote hex colours — unquoted # starts a YAML comment (value becomes empty).
      # SENDIT_HIGHLIGHT: "#a586e0"
      # SENDIT_HIGHLIGHT: "#random"   # new accent each API start; see logs for chosen hex
      # SENDIT_TICKET_KEY: "openssl-rand-base64-32"
      # SENDIT_DATA_KEY: "openssl-rand-base64-32"
      # SENDIT_ALLOWED_EMAIL_DOMAINS: example.com
      # SENDIT_BANNED_EMAILS: bad@example.com,spam@evil.org
      # SENDIT_LOG_LEVEL: WARNING
      # SENDIT_LOG_FILE: /data/security.log
      # Full list: docs/CONFIGURATION.md
    volumes:
      - sendit-data:/data
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  sendit-data:
